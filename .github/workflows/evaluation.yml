name: scheduled retrieval evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: '24 7 * * 1'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-gate.txt
      - run: PYTHONPATH=src python scripts/check_release_gate.py --output artifacts/gate --publish artifacts/last-passing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-evaluation
          path: artifacts/
